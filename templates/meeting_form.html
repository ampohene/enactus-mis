{% extends "base.html" %}{% block body %}<h1>{{ 'Edit' if m else 'Schedule' }} meeting</h1>
{% if not is_top() %}<p class="muted">Sent to the President and Vice President for approval.</p>{% endif %}
<form method="post" class="panel"><input type="hidden" name="csrf" value="{{ csrf }}">
<label for="t">Title</label><input id="t" name="title" type="text" value="{{ m.title if m else '' }}" required>
<label for="d">Date</label><input id="d" name="held_on" type="date" value="{{ m.held_on if m else today }}" required>
<label for="l">Location</label><input id="l" name="location" type="text" value="{{ (m.location or '') if m else '' }}">
<p><button class="btn">{{ 'Save changes' if m else 'Schedule meeting' }}</button> <a class="btn alt" href="{{ url_for('meetings') }}">Cancel</a></p></form>{% endblock %}
