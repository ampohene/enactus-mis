{% extends "base.html" %}{% block body %}<h1>Change password</h1>
{% if user.must_change %}<div class="panel">Set a new password before you continue.</div>{% endif %}
<form method="post" class="panel"><input type="hidden" name="csrf" value="{{ csrf }}">
{% if user.pw_hash %}<label for="c">Current password</label><input id="c" name="current" type="password" required autocomplete="current-password">{% endif %}
<label for="n">New password (10+ characters)</label><input id="n" name="new" type="password" required minlength="10" autocomplete="new-password">
<p><button class="btn">Save password</button></p></form>{% endblock %}
